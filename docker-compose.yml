services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: repopilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  qdrant_storage:
