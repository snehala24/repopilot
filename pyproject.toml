[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot — agentic GitHub developer copilot (Advanced RAG + LangGraph + MCP)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "tenacity==9.1.4",
    "google-genai==2.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["repopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
